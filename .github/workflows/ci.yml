name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          [lint, format, typecheck, test, credentials, security, react-compiler]
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The demo still imports this ignored file until the server slice replaces it.
      # Example values permit static checks and do not authorize live API access.
      - run: cp packages/app/src/config.example.ts packages/app/src/config.ts
      - if: matrix.check == 'lint'
        run: npm run lint
      - if: matrix.check == 'format'
        run: npm run format:check
      - if: matrix.check == 'typecheck'
        run: npm run typecheck
      - if: matrix.check == 'test'
        run: npm test
      - if: matrix.check == 'credentials'
        run: npm run secrets
      - if: matrix.check == 'security'
        run: npm run security
      - if: matrix.check == 'react-compiler'
        run: npm run react-compiler-check
